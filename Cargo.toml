[package]
name = "bron"
# 0.0.0 until the first tag. The changelog states the JSON contract is not
# stable until there is a v0.1.0, and a manifest claiming that version before
# the tag exists would make it false.
version = "0.0.0"
edition = "2024"
# Let chains in `if` are stable from 1.88.
rust-version = "1.88"
description = "Dutch primary legal sources, quotable to the byte: wetgeving, rechtspraak, kamerstukken"
homepage = "https://bron.steddle.com"
documentation = "https://bron.steddle.com/en/docs/cli"
repository = "https://github.com/steddle/bron-cli"
readme = "README.md"
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE"]
keywords = ["law", "netherlands", "legal", "citation", "rechtspraak"]
categories = ["command-line-utilities"]
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
# rustls, not native-tls: native-tls needs OpenSSL headers to build on Linux.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "charset",
    "http2",
    # The platform's roots, not the bundled Mozilla set: BRON_MIRROR can name a
    # deployment whose certificate a local development CA issued.
    "rustls-tls-native-roots",
] }
serde = { version = "1", features = ["derive"] }
# raw_value: `--json` prints the service's error object byte for byte.
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
# Word diffs in human output only; the JSON carries both full texts.
similar = "3.1"
thiserror = "2"

[dev-dependencies]
# The transport's refusal and retry-after paths need a server that misbehaves
# on cue, which a fixture file cannot be.
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
strip = true
lto = true
